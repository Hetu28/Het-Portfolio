<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Matching Nav 'H' button -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d26" />
      <stop offset="60%" stop-color="#ff2800" />
      <stop offset="100%" stop-color="#c41800" />
    </linearGradient>

    <!-- Top Gloss Sheen -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bevel Highlight -->
    <linearGradient id="bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="130" ry="130" fill="url(#badgeGrad)" />

  <!-- Bevel Border -->
  <rect x="17" y="17" width="478" height="478" rx="129" ry="129" fill="none" stroke="url(#bevel)" stroke-width="4" />

  <!-- Top Half Glass Highlight -->
  <path d="M 18 146 C 18 75 75 18 146 18 L 366 18 C 437 18 494 75 494 146 L 494 250 C 370 270 142 270 18 250 Z" fill="url(#gloss)" />

  <!-- Bold White H -->
  <text x="256" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="285" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-4">H</text>
</svg>
